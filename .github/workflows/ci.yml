name: CI

# Déclenchement : à chaque push sur main et à chaque pull request qui vise main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Droits minimum : le workflow a seulement besoin de lire le code du dépôt.
permissions:
  contents: read

jobs:
  test:
    # Machine Linux : suffisant car on ne teste que CAPI_CORE et CAPI_TESTS.
    # L'application WPF (CAPI_APP) ne compile que sous Windows, on ne la construit donc pas ici.
    runs-on: ubuntu-latest

    steps:
      # Récupère le code du dépôt sur la machine de la CI.
      # Action épinglée sur le SHA du commit de la version v5.1.0 (et non sur un tag qui peut bouger).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Installe le SDK .NET 10, nécessaire pour compiler et lancer les tests.
      # Action épinglée sur le SHA du commit de la version v5.4.0.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      # Compile CAPI_CORE et le projet de tests, puis lance tous les tests xUnit.
      # Si un seul test échoue, la commande échoue et la CI devient rouge.
      - name: Tests du moteur de règles
        run: dotnet test CAPI/CAPI_TESTS/CAPI_TESTS.csproj
